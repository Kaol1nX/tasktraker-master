<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки корпуса</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Заявки корпуса</h1>

    <section class="form-section">
      <div class="field">
        <label for="title">Что случилось?</label>
        <input type="text" id="title">
      </div>

      <div class="field">
        <label for="room">Где?</label>
        <input type="text" id="room">
      </div>

      <div class="field">
        <label for="category">Категория</label>
        <select id="category">
          <option value="">Выберите категорию</option>
          <option value="Оборудование">Оборудование</option>
          <option value="Аудитория">Аудитория</option>
          <option value="Другое">Другое</option>
        </select>
      </div>

      <button id="add-btn" type="button">Добавить заявку</button>

      <p id="message" class="message" role="alert"></p>
    </section>

    <section class="filters">
      <label class="checkbox-label">
        <input type="checkbox" id="only-open">
        Только открытые
      </label>

      <label for="filter-category" class="filter-label">Категория:</label>
      <select id="filter-category">
        <option value="">Все категории</option>
        <option value="Оборудование">Оборудование</option>
        <option value="Аудитория">Аудитория</option>
        <option value="Другое">Другое</option>
      </select>
    </section>

    <ul id="tickets-list" class="tickets-list"></ul>
  </main>

  <script src="index.js"></script>
</body>
</html>
